services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_meet
      POSTGRES_USER: agent_meet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env.local}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - agent-meet-data:/var/lib/postgresql/data
volumes:
  agent-meet-data:
