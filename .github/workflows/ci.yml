name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_meet_test
          POSTGRES_USER: agent_meet
          # Public, per-run credentials for this disposable service only.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_meet -d agent_meet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agent_meet:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/agent_meet_test
      APP_URL: http://127.0.0.1:3000
      DATA_MODE: fixture
      EMAIL_MODE: fixture
      ENABLE_V2: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up the packageManager-pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to disposable database
        run: pnpm db:migrate
      - name: Check types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Run unit and database integration tests
        run: pnpm test
      - name: Build production application
        run: pnpm build
      - name: Install Chromium and operating system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser flows against the production server
        run: pnpm test:e2e
